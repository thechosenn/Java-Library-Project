spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# --- JWT ---
# In a real deployed app, override this via an environment variable -
# never keep a real secret checked into git. This is fine for local learning.
app.jwt.secret=super-secret-key-change-this-in-real-apps-please-1234567890
app.jwt.expiration-ms=86400000

